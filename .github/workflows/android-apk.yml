name: Compilar APK Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Construir APK de prueba
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # El proyecto todavía no contiene gradle-wrapper.jar.
      # Usamos una instalación explícita de Gradle; no dependemos de ./gradlew.
      - name: Instalar Gradle 9.3.1 y activar caché
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar plataforma Android API 37.0
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Compilar APK de depuración
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Comprobar APK generado
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK en GitHub Releases
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="debug-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            "app/build/outputs/apk/debug/app-debug.apk#Recomp-debug.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Recomp · Compilación #${GITHUB_RUN_NUMBER}" \
            --notes "APK Android de depuración generado automáticamente desde main. Uso de prueba; no firmado para distribución oficial. Los APK de ejecuciones diferentes pueden requerir desinstalar la versión previa." \
            --prerelease
