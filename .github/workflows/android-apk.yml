name: Compilar y publicar Recomp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Verificar compilación Android
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - uses: android-actions/setup-android@v4
      - name: Instalar Android API 37.0
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Compilar APK debug
        run: gradle --no-daemon --stacktrace :app:assembleDebug

  signed-release:
    name: Publicar actualización firmada
    needs: test-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Comprobar configuración de firma
        id: signing
        env:
          KEY_B64: ${{ secrets.RECOMP_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.RECOMP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RECOMP_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RECOMP_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEY_B64" && -n "$STORE_PASS" && -n "$KEY_ALIAS" && -n "$KEY_PASS" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Faltan los cuatro secrets RECOMP_*. No se publica APK hasta configurar firma permanente."
          fi

      - name: Descargar código fuente
        if: steps.signing.outputs.configured == 'true'
        uses: actions/checkout@v4
      - name: Configurar Java 17
        if: steps.signing.outputs.configured == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle 9.3.1
        if: steps.signing.outputs.configured == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Configurar Android SDK
        if: steps.signing.outputs.configured == 'true'
        uses: android-actions/setup-android@v4
      - name: Instalar Android API 37.0
        if: steps.signing.outputs.configured == 'true'
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Preparar clave privada de firma
        if: steps.signing.outputs.configured == 'true'
        env:
          KEY_B64: ${{ secrets.RECOMP_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/recomp-release.jks"
          chmod 600 "$RUNNER_TEMP/recomp-release.jks"
          echo "RECOMP_KEYSTORE_PATH=$RUNNER_TEMP/recomp-release.jks" >> "$GITHUB_ENV"

      - name: Compilar APK firmado
        if: steps.signing.outputs.configured == 'true'
        env:
          RECOMP_KEYSTORE_PASSWORD: ${{ secrets.RECOMP_KEYSTORE_PASSWORD }}
          RECOMP_KEY_ALIAS: ${{ secrets.RECOMP_KEY_ALIAS }}
          RECOMP_KEY_PASSWORD: ${{ secrets.RECOMP_KEY_PASSWORD }}
        run: |
          gradle --no-daemon --stacktrace :app:assembleRelease \
            -PciVersionCode="$GITHUB_RUN_NUMBER" \
            -PciVersionName="0.2.$GITHUB_RUN_NUMBER"
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Publicar APK en GitHub Releases
        if: steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Recomp.apk"
          SHA256="$(sha256sum "$RUNNER_TEMP/Recomp.apk" | awk '{print $1}')"
          TAG="v0.2.$GITHUB_RUN_NUMBER"
          NOTES="$(printf 'VersionCode: %s\nSHA256: %s\n\nVersión firmada para actualizaciones desde Recomp. Android solicita autorización para instalar.' "$GITHUB_RUN_NUMBER" "$SHA256")"
          gh release create "$TAG" "$RUNNER_TEMP/Recomp.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Recomp 0.2.$GITHUB_RUN_NUMBER" \
            --notes "$NOTES" --prerelease
